<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypt & Decrypt</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #181818;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2b2b;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #3c3c3c;
            color: #f0f0f0;
            border: none;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            resize: none;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #3c3c3c;
            color: #f0f0f0;
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #444;
            color: #f9d74d;
            border: none;
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #f9d74d;
            color: #1a1a1a;
        }
        .output {
            background-color: #3c3c3c;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Encrypt & Decrypt</h2>
        <input type="password" id="password" placeholder="Enter password" />
        <textarea id="inputText" placeholder="Enter text..."></textarea>
        <button onclick="encryptText()">Encrypt</button>
        <button onclick="decryptText()">Decrypt</button>
        <div class="output" id="outputText"></div>
    </div>
    
    <script>
        function encryptText() {
            let text = document.getElementById("inputText").value;
            let password = document.getElementById("password").value;
            if (!password) {
                alert("Please enter a password!");
                return;
            }
            let encrypted = CryptoJS.AES.encrypt(text, password).toString();
            document.getElementById("outputText").textContent = encrypted;
        }
        function decryptText() {
            let text = document.getElementById("inputText").value;
            let password = document.getElementById("password").value;
            if (!password) {
                alert("Please enter a password!");
                return;
            }
            try {
                let bytes = CryptoJS.AES.decrypt(text, password);
                let decrypted = bytes.toString(CryptoJS.enc.Utf8);
                document.getElementById("outputText").textContent = decrypted || "Invalid encrypted text or password!";
            } catch (e) {
                document.getElementById("outputText").textContent = "Invalid encrypted text or password!";
            }
        }
    </script>
</body>
</html>
